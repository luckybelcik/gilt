[package]
name = "tree-sitter-gilt"
description = "Safe modding language for Kingdoms Game"
version = "0.1.0"
authors = ["Stargrazer Games"]
license = "no"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "gilt"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/luckybelcik/gilt-lang"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
